---
- name: Configurar Docker localmente
  hosts: localhost
  connection: local
  become: true

  vars:
    local_user: "{{ lookup('ansible.builtin.env', 'USER') }}"

  pre_tasks:
    - name: Verificar systemd antes de configurar Docker
      ansible.builtin.import_tasks: tasks/check-systemd.yml
      tags: check_systemd

  tasks:
    - name: Habilitar e iniciar el servicio Docker
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: started

    - name: Permitir usar Docker sin sudo
      ansible.builtin.user:
        name: "{{ local_user }}"
        groups: docker
        append: true
