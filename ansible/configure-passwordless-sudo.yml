---
- name: Configurar sudo sin contrasena localmente
  hosts: localhost
  connection: local
  become: true

  vars:
    local_user: "{{ lookup('ansible.builtin.env', 'USER') }}"

  tasks:
    - name: Permitir sudo sin contrasena al usuario local
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ local_user }}"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
        content: "{{ local_user }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
